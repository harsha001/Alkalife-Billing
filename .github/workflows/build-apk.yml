name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MyBilling.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBilling-APK
          path: dist/MyBilling.apk
          if-no-files-found: error

      - name: Publish to "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: My Billing — Latest APK
          body: |
            **My Billing** — Vyapar-style invoicing & estimates app.

            Download `MyBilling.apk` below and install it on any Android phone.
            If prompted, allow "Install unknown apps" for your browser or file manager.
            All invoice data is stored privately on the device.
          files: dist/MyBilling.apk
